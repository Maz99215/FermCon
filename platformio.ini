; =====================================================================
; FermCon - configuration PlatformIO
; env:esp32-c6  -> build & flash sur la cible réelle / Wokwi
; env:native    -> tests unitaires sur PC (pio test -e native)
; =====================================================================

[env:esp32-c6]
board = esp32-c6-devkitc-1
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI
    bblanchon/ArduinoJson@^7.2.0
    ayushsharma82/AsyncElegantOTA
    tzapu/WiFiManager
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    knolleary/PubSubClient
    paulstoffregen/OneWire
    milesburton/DallasTemperature

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=10
    -DTFT_DC=11
    -DTFT_RST=21
    -DTFT_BL=22
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

; Options offsets ST7789 possibles pour écran 2.25 pouces :
; -DCGRAM_OFFSET=0x0
; -DCGRAM_OFFSET=0x20
; -DCGRAM_OFFSET=0x40


; --------------------------------------------------------------------
; Tests unitaires natifs (sur PC, sans matériel) :  pio test -e native
; --------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST
    -std=c++17
    -I test/mocks
    -include test/mocks/time_mock.h   ; remappe time() -> mock_time() partout
; On ne compile QUE les modules testables en natif (pas de TFT/OneWire/Async) :
build_src_filter =
    -<*>
    +<RelayController.cpp>
    +<ProfileManager.cpp>
    +<FermentationInfo.cpp>
    +<TemperatureController.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
