; =====================================================================
; FermCon - configuration PlatformIO
; env:esp32-c6  -> build & flash sur la cible réelle / Wokwi
; env:native    -> tests unitaires sur PC (pio test -e native)
; =====================================================================

[env:esp32-c6]
board = esp32-c6-devkitc-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

lib_deps =

    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
    ayushsharma82/ElegantOTA
    tzapu/WiFiManager
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    knolleary/PubSubClient
    milesburton/DallasTemperature
    pstolarz/OneWireNg


lib_ignore =
    OneWire


build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    

; Options offsets ST7789 possibles pour écran 2.25 pouces :
; -DCGRAM_OFFSET=0x0
; -DCGRAM_OFFSET=0x20
; -DCGRAM_OFFSET=0x40


; --------------------------------------------------------------------
; Tests unitaires natifs (sur PC, sans matériel) :  pio test -e native
; --------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST
    -std=c++17
    -I test/mocks
    -include test/mocks/time_mock.h   ; remappe time() -> mock_time() partout
; On ne compile QUE les modules testables en natif (pas de TFT/OneWire/Async) :
build_src_filter =
    -<*>
    +<RelayController.cpp>
    +<ProfileManager.cpp>
    +<FermentationInfo.cpp>
    +<TemperatureController.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
